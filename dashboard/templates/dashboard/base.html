<!doctype html>
<html lang="ru" class="h-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% block title %}<title>Investing Demo</title>{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column h-100">

<header class="border-bottom">
    <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3">
            <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
                <li><a href="{% url 'dashboard:index' %}" class="nav-link px-2 link-secondary">Главная</a></li>
            </ul>
            <div class="col-md-3 text-end">
                {% if user.is_authenticated %}
                    <span class="me-2">Привет, {{ user.email|default:user.username }}</span>
                    <a href="{% url 'user:logout' %}" class="btn btn-outline-primary btn-sm">Выход</a>
                {% else %}
                    <a href="{% url 'user:auth' %}" class="btn btn-primary btn-sm">Войти</a>
                    <a href="{% url 'user:registration' %}" class="btn btn-outline-secondary btn-sm">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>

<main class="flex-shrink-0">
    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>
</main>

<footer class="footer mt-auto py-3 bg-light">
    <div class="container text-center">
        <span class="text-muted">Investing Demo — AI Coding Agents Homework</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
