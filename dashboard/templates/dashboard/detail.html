{% extends "dashboard/base.html" %}
{% block title %}<title>{{ share.ticker }}</title>{% endblock %}
{% block content %}
<a href="{% url 'dashboard:index' %}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Назад</a>
<div class="card mb-3">
    <div class="card-body">
        <h3>{{ share.name }} <small class="text-muted">{{ share.ticker }}</small></h3>
        <p>Цена: <strong>{{ share.last_price|default:"—" }} {{ share.currency }}</strong></p>
        <p class="small text-muted">Обновлено: {{ share.updated_at|default:"—" }}</p>
    </div>
</div>
<form method="get" class="mb-2">
    <select name="days" class="form-select form-select-sm w-auto d-inline" onchange="this.form.submit()">
        <option value="30" {% if days == 30 %}selected{% endif %}>30д</option>
        <option value="90" {% if days == 90 %}selected{% endif %}>90д</option>
        <option value="180" {% if days == 180 %}selected{% endif %}>180д</option>
        <option value="365" {% if days == 365 %}selected{% endif %}>365д</option>
    </select>
</form>
{{ plot_div|safe }}
{% endblock %}
