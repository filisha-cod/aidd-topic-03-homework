{% extends "dashboard/base.html" %}

{% block title %}
<title>Удаление акции</title>
{% endblock %}

{% block content %}
<h2>Удалить акцию?</h2>
<p>Вы уверены, что хотите удалить <strong>{{ object.ticker }} — {{ object.name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'dashboard:index' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
